<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        
    </style>
</head>
<body>
    Enter Movie Name: <input type="text" id="title">
    <button type="button" onclick="getapi();">Submit</button>
    <p id="Title">    </p>
    <p id="Writer"></p>
    <p id="Year"></p>
    <p id="Released"></p>
    <p id="cast"></p>
    <p><img src="" id="poster"></p>
    

    <script>
        async function getapi() {
        var movie = document.getElementById("title").value;
        var api_url = "https://www.omdbapi.com/?t="+movie+"&apikey=ec03d09";


        
        var response = await fetch(api_url);
        var data = await response.json();

        document.getElementById("Writer").innerHTML = "Writer: "+data.Writer;
        document.getElementById("Title").innerHTML = "Title: "+data.Title;
        document.getElementById("Year").innerHTML = "Year: "+data.Year;
        document.getElementById("Released").innerHTML = "Released: "+data.Released;
        document.getElementById("cast").innerHTML = "cast: "+data.Actors;
        document.getElementById("poster").src=data.Poster;
    
         }

</script>
</body>
</html>
